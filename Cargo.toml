[workspace]
members = [".", "crates/swactor-python", "crates/swactor-wasm", "crates/swactor-gossip", "crates/gossip-dashboard", "crates/runtime-dashboard"]
exclude = ["tools/depgraph"]

[package]
name = "swactor"
version = "0.1.0"
edition = "2024"
autobenches = false

[profile.bench]
debug = true       
strip = false      

[lib]
crate-type = ["rlib"]

[features]
default = ["getrandom"]
getrandom = ["dep:getrandom"]
serde = ["dep:serde"]
tracing = ["dep:tracing"]
no_random = [] # compile without access to a source of randomness
transport = []  # transport-agnostic messaging (no mandatory deps; codec is user-provided)

[dependencies]
getrandom = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tracing = { version = "0.1", optional = true }
crossbeam-queue = "0.3.12"
crossbeam-utils = "0.8.21"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "runtime_benchmarks"
harness = false

[[bench]]
name = "mt_benchmarks"
harness = false

[[example]]
name = "tcp_ping_pong"
required-features = ["transport"]
