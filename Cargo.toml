[workspace]
members = [".", "crates/swactor-python", "crates/swactor-wasm", "crates/swactor-gossip", "crates/gossip-dashboard"]
exclude = ["tools/depgraph"]

[package]
name = "swactor"
version = "0.1.0"
edition = "2024"
autobenches = false

[lib]
crate-type = ["rlib"]

[features]
default = ["getrandom"]
getrandom = ["dep:getrandom"]
serde = ["dep:serde"]
no_random = [] # compile without access to a source of randomness

[dependencies]
getrandom = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
crossbeam-queue = "0.3.12"
crossbeam-utils = "0.8.21"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "runtime_benchmarks"
harness = false

[[bench]]
name = "worker_benchmarks"
harness = false
