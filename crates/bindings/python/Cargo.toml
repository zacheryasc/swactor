[package]
name = "python"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "swactor"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "myelin-e2e-python"
path = "src/bin/myelin_e2e_python.rs"
required-features = ["launcher"]
test = false

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
launcher = ["pyo3/auto-initialize"]

[dependencies]
swactor-core = { package = "swactor", path = "../../.." }
swactor-engine = { path = "../../engine", features = ["tokio"] }
swactor-process = { path = "../../process" }
swactor-process-context = { path = "../../process-context" }
swactor-transport = { path = "../../transport" }
data-plane = { path = "../../data-plane" }
distribution = { path = "../../distribution" }
iroh-driver = { path = "../../iroh-driver" }
base64 = "0.22"
flate2 = "1"
libc = "0.2"
futures-lite = "2"
iroh.workspace = true
parking_lot = "0.12"
serde_json = "1"
pyo3 = { version = "0.23", features = ["abi3-py312"] }
tokio.workspace = true

[lints]
workspace = true
