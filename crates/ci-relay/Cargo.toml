[package]
name = "ci-relay"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ci-relay"
path = "src/main.rs"

[dependencies]
swactor-ci = { path = "../ci", features = ["local"] }
iroh = "0.96"
tokio = { version = "1", features = ["rt-multi-thread"] }
tiny_http = "0.12"
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
