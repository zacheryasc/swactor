[package]
name = "swactor-ci"
version = "0.1.0"
edition = "2024"

[dependencies]
swactor = { path = "../..", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Shared optional deps (used by lib local feature and binaries)
tiny_http = { version = "0.12", optional = true }
ureq = { version = "2", features = ["json"], optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }

# Binary-only optional deps
iroh = { version = "0.96", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
ctrlc = { version = "3", optional = true }
dashboard = { path = "../dashboard", optional = true }

[features]
default = []
local = [
    "dep:tiny_http",
    "dep:ureq",
    "dep:hmac",
    "dep:sha2",
    "dep:hex",
]
relay = [
    "local",
    "dep:iroh",
    "dep:tokio",
    "dep:clap",
]
runner = [
    "local",
    "dep:iroh",
    "dep:tokio",
    "dep:clap",
    "dep:ctrlc",
    "dep:dashboard",
]

[dev-dependencies]

[[bin]]
name = "ci-relay"
path = "src/bin/ci_relay.rs"
required-features = ["relay"]

[[bin]]
name = "local-runner"
path = "src/bin/local_runner.rs"
required-features = ["runner"]
