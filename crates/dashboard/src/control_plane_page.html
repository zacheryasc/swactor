<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>swactor fleet</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      /* dark: Bloomberg night housing */
      --bg: #000000; --panel: #001220; --panel-hover: #001c38; --inset: #00060c;
      --border: #14406a; --divider: #0d2c4a;
      --text: #ffffff; --muted: #9db2c4;
      --amber: #ff9900; --ghost: rgba(255, 153, 0, .16);
      --ok: #00d400; --bad: #ff4141; --cyan: #5cd5ff;
      --primary-fill: #ff9900; --primary-ink: #000000;
      --danger-fill: #7a1010; --danger-border: #ff4141; --danger-ink: #ffd7d7;
      --selected: rgba(255, 153, 0, .10); --selected-edge: #ff9900;
      --card-hover: #00263f; --row-hover: #002a47;
      --r: 2px; --t: 120ms;
      background: var(--bg); color: var(--text);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      /* light: Atom One Light bench card */
      --bg: #fafafa; --panel: #ffffff; --panel-hover: #f0f0f0; --inset: #f5f5f5;
      --border: #dcdcE0; --divider: #eaeaea;
      --text: #383a42; --muted: #696c77;
      --amber: #986801; --ghost: rgba(152, 104, 1, .18);
      --ok: #50a14f; --bad: #e45649; --cyan: #0184bc;
      --primary-fill: #0184bc; --primary-ink: #ffffff;
      --danger-fill: #cc3a2f; --danger-border: #cc3a2f; --danger-ink: #ffffff;
      --selected: rgba(64, 120, 242, .08); --selected-edge: #4078f2;
      --card-hover: #f0f4fb; --row-hover: #eef1f8;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        color-scheme: light;
        --bg: #fafafa; --panel: #ffffff; --panel-hover: #f0f0f0; --inset: #f5f5f5;
        --border: #dcdcE0; --divider: #eaeaea;
        --text: #383a42; --muted: #696c77;
        --amber: #986801; --ghost: rgba(152, 104, 1, .18);
        --ok: #50a14f; --bad: #e45649; --cyan: #0184bc;
        --primary-fill: #0184bc; --primary-ink: #ffffff;
        --danger-fill: #cc3a2f; --danger-border: #cc3a2f; --danger-ink: #ffffff;
        --selected: rgba(64, 120, 242, .08); --selected-edge: #4078f2;
        --card-hover: #f0f4fb; --row-hover: #eef1f8;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; }
    header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 20px; }
    h2 { margin: 20px 0 10px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--amber); }
    .muted { color: var(--muted); }
    .mono { font-family: var(--mono); font-size: 12px; }
    #status { font-family: var(--mono); font-size: 13px; color: var(--amber); }
    a.node-card { color: inherit; text-decoration: none; display: block; }
    .node-card.orchestrator { grid-column: 1 / -1; border-color: var(--amber); background: var(--ghost); box-shadow: inset 3px 0 0 var(--amber); padding-left: 17px; }
    .node-card.orchestrator .role { margin-bottom: 6px; color: var(--muted); font: 600 9px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .12em; }
    :is(a, button, input, summary):focus-visible, tr[data-addr]:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .node-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; cursor: pointer; transition: border-color var(--t), background var(--t); }
    .node-card:hover { border-color: var(--amber); background: var(--card-hover); }
    .node-card[data-live="false"] { opacity: .55; }
    .node-card h3 { margin: 0 0 2px; font: 700 13px/1.4 var(--mono); word-break: break-all; }
    .node-card .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .bars { display: grid; gap: 5px; }
    .bar-row { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; }
    .bar-row .name { width: 92px; color: var(--muted); }
    .bar-track { flex: 1; height: 8px; background: var(--inset); border-radius: var(--r); overflow: hidden; }
    .bar-fill { height: 100%; }
    .bar-fill.ok { background: var(--ok); } .bar-fill.warn { background: var(--amber); } .bar-fill.bad { background: var(--bad); }
    .bar-row .num { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
    .pill { display: inline-flex; padding: 3px 6px; border: 1px solid var(--muted); border-radius: var(--r); font: 600 10px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--text); }
    .pill.live { color: var(--ok); border-color: var(--ok); }
    .pill.stale { color: var(--bad); border-color: var(--bad); }
    .pill.provisioning { color: var(--amber); border-color: var(--amber); }
    .pill.poisoned { color: var(--bad); border-color: var(--bad); font-weight: 700; }
    details.stale { margin-top: 18px; }
    details.stale summary { cursor: pointer; color: var(--muted); padding: 8px 0; font-family: var(--mono); font-size: 12px; }
    .focus-back { display: inline-block; margin-bottom: 12px; color: var(--cyan); text-decoration: none; font-family: var(--mono); font-size: 12px; }
    .focus-back:hover { color: var(--amber); }
    .node-view { display: grid; gap: 14px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; }
    table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--divider); font-variant-numeric: tabular-nums; }
    th { color: var(--amber); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .roster-sort-controls { display: inline-flex; gap: 2px; margin-left: 4px; vertical-align: middle; }
    .roster-sort-button { position: relative; width: 14px; height: 14px; padding: 0; color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: var(--r); font-size: 0; line-height: 0; cursor: pointer; }
    .roster-sort-button::before { content: ""; position: absolute; left: 3px; width: 0; height: 0; border-left: 3px solid transparent; border-right: 3px solid transparent; }
    .roster-sort-button[data-direction="asc"]::before { top: 3px; border-bottom: 5px solid currentColor; }
    .roster-sort-button[data-direction="desc"]::before { bottom: 3px; border-top: 5px solid currentColor; }
    .roster-sort-button:hover, .roster-sort-button[aria-pressed="true"] { color: var(--cyan); border-color: var(--cyan); background: var(--panel-hover); }
    tbody tr[data-addr] { cursor: pointer; transition: background var(--t); }
    tbody tr[data-addr]:hover { background: var(--row-hover); }
    tbody tr[data-selected="true"] { background: var(--selected); box-shadow: inset 2px 0 0 var(--selected-edge); }
    input[type=search] { background: var(--inset); color: var(--text); border: 1px solid var(--border); border-radius: var(--r); padding: 7px 10px; width: 240px; max-width: 100%; font: 12px var(--mono); }
    input[type=search]:hover { border-color: var(--cyan); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    @media (min-width: 1100px) { .layout.with-dossier { grid-template-columns: minmax(0, 1fr) 420px; } }
    .dossier { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 24px); overflow: auto; }
    .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 10px; font-size: 13px; }
    .kv .k { color: var(--muted); font-family: var(--mono); font-size: 12px; }
    .diet .bar-row .name { width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .receipts td { font-size: 11px; }
    .empty { padding: 24px; border: 1px dashed var(--border); border-radius: var(--r); color: var(--muted); font-family: var(--mono); font-size: 12px; }
    .notice { font-size: 12px; color: var(--muted); margin: 6px 0; }
    canvas { width: 100%; height: 64px; background: var(--inset); border: 1px solid var(--border); border-radius: var(--r); }
    .output-head { display:flex; justify-content:space-between; gap:12px; align-items:baseline; margin-bottom:8px; }
    .output-tail { margin:0; height:180px; overflow:auto; padding:10px; background:var(--inset); border:1px solid var(--divider); border-radius:var(--r); color:var(--text); font:11px/1.45 var(--mono); white-space:pre-wrap; overflow-wrap:anywhere; }
    .hardware-source { margin-bottom: 8px; }
    .hardware-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; }
    .hw-card { min-width: 0; padding: 10px; background: var(--inset); border: 1px solid var(--divider); border-radius: var(--r); }
    .hw-card.cpu { grid-column: span 7; }
    .hw-card.memory { grid-column: span 5; }
    .hw-card.storage, .hw-card.gpu, .hw-card.network { grid-column: span 4; }
    .hw-card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
    .hw-card-title { color: var(--muted); font: 700 10px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .09em; }
    .hw-card-value { color: var(--text); font: 700 16px/1 var(--mono); font-variant-numeric: tabular-nums; }
    .hw-card-subtitle { margin-top: 5px; color: var(--muted); font: 11px/1.35 var(--mono); }
    .metric-pair { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; color: var(--muted); font: 11px/1.3 var(--mono); }
    .metric-pair strong { color: var(--text); font-weight: 600; }
    .pressure-value.ok { color: var(--ok); } .pressure-value.warn { color: var(--amber); } .pressure-value.bad { color: var(--bad); }
    canvas.thread-graph { height: 72px; background: var(--bg); border-color: var(--divider); image-rendering: pixelated; }
    .thread-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(26px, 1fr)); gap: 3px; margin-top: 5px; }
    .thread-cell { min-width: 0; height: 20px; display: grid; place-items: center; border: 1px solid var(--divider); border-radius: var(--r); color: var(--text); font: 9px/1 var(--mono); font-variant-numeric: tabular-nums; }
    .network-list { display: grid; gap: 6px; }
    .network-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font: 11px/1.25 var(--mono); }
    .network-row .interface { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    .hw-empty { color: var(--muted); font: 11px/1.35 var(--mono); }
    @media (max-width: 900px) {
      .hw-card.cpu { grid-column: span 12; }
      .hw-card.memory, .hw-card.storage, .hw-card.gpu, .hw-card.network { grid-column: span 6; }
    }
    @media (max-width: 600px) {
      .hw-card.cpu, .hw-card.memory, .hw-card.storage, .hw-card.gpu, .hw-card.network { grid-column: span 12; }
    }
    .err { color: var(--bad); }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation: none !important; } }
  </style>
</head>
<body>
<!--
swactor dashboard — direction contract (impeccable seed 8b5f2278)
THESIS: a numeric instrument bank for a live actor fleet; Bloomberg night housing (dark) / Atom One Light bench card (light); absence drawn as designed negative space, never blank.
OWN-WORLD: black-on-navy or paper-on-white; amber owns the data register, green/red are law, cyan is the only interactive voice; 2px corners, monospace data, machined caps labels, controls that depress.
FIRST VIEWPORT: the fleet as an instrument rack — orchestrator module pinned with an amber edge, node cards as module slots with state tags.
SIGNATURE: state as instrument grammar — lit tag for live, struck dim for dead, no skeleton bars for silent channels.
RISK: terminal cosplay if decoration creeps past data; held by the palette law.
-->
<!--swactor:nav-->
<header>
  <h1>Fleet</h1>
  <span class="muted" id="status" role="status" aria-live="polite">loading…</span>
</header>

<div id="page">
  <div class="empty">Waiting for telemetry frames…</div>
</div>

<script>
'use strict';
const POLL_MS = 1000;
const ROSTER_RENDER_CAP = 200;

const params = new URLSearchParams(window.location.search);
let selectedStream = params.get('stream') || null;
let selectedActor = params.get('actor') || null;
let rosterFilter = '';
let rosterSort = { key: 'address', direction: 'asc' };
let hardwareSource = 'node';
let lastSnapshot = null;
let detailTimer = null;
let refreshInFlight = false;
// A1: last-rendered HTML per region. A poll that yields identical markup
// must not swap innerHTML — the swap destroyed hover/selection/presses and
// restarted animations every second even in a fully converged steady state.
let lastPageHtml = null;
let lastRosterHtml = null;
let lastMachineHtml = null;
let lastDossierHtml = null;

window.addEventListener('dashboard-hardware-source', event => {
  const next = event.detail?.source === 'orchestrator' ? 'orchestrator' : 'node';
  if (next === hardwareSource) return;
  hardwareSource = next;
  lastMachineHtml = null;
  if (lastSnapshot) render();
});

// Receipt ages (dossier) render as empty spans carrying an absolute epoch —
// stable across polls — and a 1 Hz pass rewrites their textContent. All other
// ticking text (card seen/stats) is written per-poll by updateCardTexts.
function agoSpan(epochMs) {
  return `<span data-ago-at="${Math.round(epochMs)}"></span>`;
}
function updateAgo() {
  const now = Date.now();
  for (const span of document.querySelectorAll('[data-ago-at]')) {
    span.textContent = ago(now - Number(span.dataset.agoAt));
  }
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
}
function fmt(value, digits = 0) {
  const n = Number(value);
  if (!Number.isFinite(n)) return '—';
  return n.toLocaleString(undefined, { maximumFractionDigits: digits });
}
function fmtRate(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return '—';
  if (n >= 1e9) return (n / 1e9).toFixed(1) + ' G';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + ' M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + ' k';
  return n.toFixed(n < 10 ? 1 : 0);
}
function fmtBytes(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return '—';
  const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
  let scaled = Math.max(0, n), unit = 0;
  while (scaled >= 1024 && unit < units.length - 1) {
    scaled /= 1024;
    unit += 1;
  }
  return scaled.toFixed(scaled < 10 && unit > 0 ? 1 : 0) + ' ' + units[unit];
}
function typeShort(name) {
  if (!name) return '—';
  const parts = String(name).split('::');
  return esc(parts[parts.length - 1] || name);
}
function ago(ms) {
  if (ms == null) return '—';
  if (ms < 1000) return ms + 'ms';
  if (ms < 60000) return Math.round(ms / 1000) + 's';
  if (ms < 3600000) return Math.round(ms / 60000) + 'm';
  return Math.round(ms / 3600000) + 'h';
}
function bar(percent, max = 100) {
  if (percent == null) return '<div class="bar-track"></div>';
  const clamped = Math.max(0, Math.min(100, percent / max * 100));
  const cls = clamped >= 90 ? 'bad' : clamped >= 70 ? 'warn' : 'ok';
  return `<div class="bar-track"><div class="bar-fill ${cls}" style="width:${clamped}%"></div></div>`;
}

function pushUrl() {
  const next = new URL(window.location);
  if (selectedStream) next.searchParams.set('stream', selectedStream); else next.searchParams.delete('stream');
  if (selectedActor) next.searchParams.set('actor', selectedActor); else next.searchParams.delete('actor');
  window.history.replaceState(null, '', next);
}

async function refresh() {
  if (refreshInFlight) return;
  refreshInFlight = true;
  try {
    const response = await fetch('/api/view/fleet');
    const data = await response.json();
    lastSnapshot = data;
    render();
  } catch {
    // Keep the last good snapshot while the next scheduled refresh retries.
  } finally {
    refreshInFlight = false;
  }
}

function render() {
  const page = document.getElementById('page');
  const status = document.getElementById('status');
  const data = lastSnapshot;
  const provisioning = data.provisioning || [];
  const live = data.live || [];
  const stale = data.stale || [];
  const totals = data.totals || {};
  status.textContent = `${fmt(totals.provisioning_nodes)} provisioning · ${fmt(totals.live_nodes)} live · ${fmt(totals.stale_nodes)} stale`;

  const node = provisioning.concat(live, stale).find(n => n.stream.key === selectedStream);
  if (node) {
    renderNode(page, node, live, stale);
  } else {
    renderFleet(page, provisioning, live, stale, totals);
  }
  updateAgo();
}

function renderFleet(page, provisioning, live, stale, totals) {
  stopDetailPolling();
  const orchestrators = live.filter(n => (n.stream.origin || '') === 'orchestrator');
  const workers = live.filter(n => (n.stream.origin || '') !== 'orchestrator');
  const parts = [];
  if (!provisioning.length && !live.length && !stale.length) {
    parts.push('<div class="empty">No telemetry streams yet. A live swactor runtime or host publisher will populate this page.</div>');
  } else {
    if (provisioning.length) {
      parts.push(`<h2>Provisioning (${provisioning.length})</h2><div class="grid">${provisioning.map(nodeCard).join('')}</div>`);
    }
    if (live.length) {
      parts.push(`<h2>Live (${live.length})</h2><div class="grid">${orchestrators.concat(workers).map(nodeCard).join('')}</div>`);
    }
    if (stale.length) {
      parts.push(`<details class="stale">
        <summary>Stale nodes (${stale.length}) — previously live, now silent beyond the liveness window</summary>
        <div class="grid">${stale.map(nodeCard).join('')}</div>
      </details>`);
    }
  }
  const html = parts.join('');
  if (html !== lastPageHtml) {
    page.innerHTML = html;
    lastPageHtml = html;
  }
  updateCardTexts(provisioning.concat(orchestrators, workers, stale));
}

function nodeCard(node) {
  const summary = node.actor_summary || {};
  const origin = node.stream.origin || '';
  const isProvisioning = origin === 'bootstrap';
  const phase = node.output?.phase || 'requested';
  const proc = isProvisioning
    ? `<span class="pill provisioning">${esc(phase)}</span> `
    : node.process ? `<span class="pill">${esc(node.process.state)}</span> ` : '';
  const isOrchestrator = origin === 'orchestrator';
  const role = isOrchestrator ? '<span class="role">orchestrator</span>' : '';
  const label = node.stream.label ? ` · ${esc(node.stream.label)}` : '';
  // The stats line (actors · msg/s · uptime) jitters every frame on busy
  // supervisors; it renders as a pass-filled span so the card markup — and
  // with it the whole grid — stays byte-identical between polls.
  return `<a class="node-card${isOrchestrator ? ' orchestrator' : ''}" data-stream="${esc(node.stream.key)}" data-node="${esc(node.stream.node)}" data-origin="${esc(origin)}" data-live="${node.live ? 'true' : 'false'}" href="?stream=${encodeURIComponent(node.stream.key)}">
    ${role}
    <h3>${esc(node.stream.node)} <span class="muted" style="font-size:12px">life ${fmt(node.stream.life)}</span></h3>
    <div class="meta">${proc}updated <span data-seen></span> ago · <span data-stats></span>${label}</div>
    ${summary.poisoned ? `<div class="notice err">${fmt(summary.poisoned)} poisoned actor(s)</div>` : ''}
  </a>`;
}

function cardStats(node) {
  const summary = node.actor_summary || {};
  return [
    summary.actors ? fmt(summary.actors) + ' actors' : null,
    summary.msg_per_sec ? fmtRate(summary.msg_per_sec) + ' msg/s' : null,
    summary.num_workers != null ? fmt(summary.num_workers) + ' workers' : null,
    summary.uptime_ms != null ? 'up ' + ago(summary.uptime_ms) : null,
  ].filter(Boolean).join(' · ') || 'no runtime stats';
}

function updateCardTexts(nodes) {
  const byStream = new Map(nodes.map(node => [node.stream.key, node]));
  for (const card of document.querySelectorAll('a.node-card')) {
    const node = byStream.get(card.getAttribute('data-stream'));
    const seen = card.querySelector('[data-seen]');
    if (seen) seen.textContent = node ? ago(node.last_seen_ms_ago) : '—';
    const stats = card.querySelector('[data-stats]');
    if (stats) stats.textContent = node ? cardStats(node) : 'no runtime stats';
  }
}

function hardwareNodeFor(node, live, stale) {
  if (hardwareSource !== 'orchestrator' || node.stream.origin === 'orchestrator') {
    return { node, mirrored: false };
  }
  const orchestrator = live.concat(stale).find(candidate => candidate.stream.origin === 'orchestrator');
  return orchestrator ? { node: orchestrator, mirrored: true } : { node, mirrored: false };
}

function renderNode(page, node, live, stale) {
  const summary = node.actor_summary || {};
  const active = document.activeElement;
  const refocus = active && active.id === 'roster-filter' && page.contains(active)
    ? { start: active.selectionStart, end: active.selectionEnd, dir: active.selectionDirection }
    : null;
  const html = `
    <a class="focus-back" href="/">← Fleet (<span data-live-count></span> live, <span data-stale-count></span> stale)</a>
    <div class="layout ${selectedActor ? 'with-dossier' : ''}">
      <div class="node-view" data-node="${esc(node.stream.node)}" data-origin="${esc(node.stream.origin || '')}">
        <section class="panel">
          <h2 style="margin:0 0 8px">${esc(node.stream.node)}${node.stream.label ? ` <span class="muted" style="font-size:13px">${esc(node.stream.label)}</span>` : ''} <span class="muted" style="font-size:13px">life ${fmt(node.stream.life)} · <span data-seen></span></span></h2>
          <div id="machine-detail"></div>
        </section>
        <section class="panel">
          <div class="output-head"><h2 style="margin:0">Node output</h2><span class="muted mono" id="output-meta"></span></div>
          <pre class="output-tail" id="node-output" aria-label="Latest node stdout and stderr"></pre>
        </section>
        <section class="panel">
          <h2 style="margin:0 0 8px">Actors (<span data-actor-count></span>)</h2>
          <input type="search" id="roster-filter" aria-label="Filter actors" placeholder="filter by type, address, worker…" value="${esc(rosterFilter)}">
          <div id="roster-wrap" style="margin-top:10px"></div>
        </section>
      </div>
      <div id="dossier-slot"></div>
    </div>`;
  if (html !== lastPageHtml) {
    page.innerHTML = html;
    lastPageHtml = html;
    lastMachineHtml = null;
    lastRosterHtml = null;
    const filter = document.getElementById('roster-filter');
    filter.addEventListener('input', e => { rosterFilter = e.target.value; renderRoster(node); });
    if (refocus) {
      filter.focus();
      try { filter.setSelectionRange(refocus.start, refocus.end, refocus.dir); } catch { /* caret shape changed */ }
    }
  }
  const liveCount = page.querySelector('[data-live-count]');
  if (liveCount) liveCount.textContent = fmt(live.length);
  const staleCount = page.querySelector('[data-stale-count]');
  if (staleCount) staleCount.textContent = fmt(stale.length);
  const actorCount = page.querySelector('[data-actor-count]');
  if (actorCount) actorCount.textContent = fmt(summary.actors);
  const seen = page.querySelector('h2 [data-seen]');
  if (seen) seen.textContent = node.live ? 'live' : 'stale ' + ago(node.last_seen_ms_ago) + ' ago';
  const machineSource = hardwareNodeFor(node, live, stale);
  const machine = machineDetail(machineSource.node, machineSource.mirrored);
  const machineSlot = document.getElementById('machine-detail');
  if (machineSlot && machine !== lastMachineHtml) {
    machineSlot.innerHTML = machine;
    lastMachineHtml = machine;
  }
  renderNodeOutput(node);
  renderRoster(node);
  if (selectedActor) {
    if (!detailTimer) startDetailPolling();
  } else {
    stopDetailPolling();
  }
}

function renderNodeOutput(node) {
  const tail = document.getElementById('node-output');
  const meta = document.getElementById('output-meta');
  if (!tail || !meta) return;
  const output = node.output || {};
  const lines = output.lines || [];
  const wasAtBottom = tail.dataset.initialized !== 'true'
    || tail.scrollHeight - tail.clientHeight - tail.scrollTop < 8;
  tail.textContent = lines.length
    ? lines.map(line => `[${line.source || '?'} · ${line.phase || '?'}] ${line.text || ''}`).join('\n')
    : 'No output observed yet.';
  tail.dataset.initialized = 'true';
  if (wasAtBottom) tail.scrollTop = tail.scrollHeight;
  const phase = output.phase || 'waiting';
  const age = output.last_output_ms_ago == null ? 'no output yet' : `last output ${ago(output.last_output_ms_ago)} ago`;
  meta.textContent = `${phase} · ${age}`;
}

function percentOf(used, total) {
  const numerator = Number(used), denominator = Number(total);
  return Number.isFinite(numerator) && Number.isFinite(denominator) && denominator > 0
    ? numerator * 100 / denominator
    : null;
}

function pressureTone(value, warn = 1, bad = 5) {
  const pressure = Number(value);
  if (!Number.isFinite(pressure)) return '';
  return pressure >= bad ? 'bad' : pressure >= warn ? 'warn' : 'ok';
}

function machineDetail(node, mirrored = false) {
  const cpu = node.cpu, gpu = node.gpu, memory = node.memory, net = node.net, storage = node.storage;
  const cpuHost = cpu?.host;
  const cpuTotal = cpuHost?.total_percent;
  const cores = [...(cpu?.cores || [])].sort((left, right) => left.index - right.index);
  const threadHeight = Math.min(92, Math.max(42, cores.length * 4));
  drawThreadGraph(node.history || [], cores.map(core => core.total_percent));
  const threadCells = cores.map(core => {
    const value = core.total_percent;
    const load = value == null ? 0 : Math.max(0, Math.min(100, Number(value)));
    const label = value == null ? '—' : fmt(value);
    return `<span class="thread-cell" title="Thread ${fmt(core.index)} · ${value == null ? 'no sample' : fmt(value, 1) + '%'}" style="background:linear-gradient(to top,var(--ok) 0%,var(--ok) ${load}%,var(--bg) ${load}%,var(--bg) 100%)">${label}</span>`;
  }).join('');
  const load = [cpuHost?.load1, cpuHost?.load5, cpuHost?.load15].map(value => fmt(value, 2)).join(' / ');
  const cpuLabel = cpuTotal == null ? '—' : fmt(cpuTotal, 1) + '%';

  const memoryPercent = percentOf(memory?.used_bytes, memory?.total_bytes);
  const memoryPressure = memory?.pressure?.some_avg10;
  const swapPercent = percentOf(memory?.swap_used_bytes, memory?.swap_total_bytes);
  const memoryLabel = memoryPercent == null ? '—' : fmt(memoryPercent, 1) + '%';

  const filesystem = storage?.filesystems?.[0];
  const storagePercent = filesystem?.used_percent;
  const ioPressure = storage?.pressure?.some_avg10;
  const storageLabel = storagePercent == null ? '—' : fmt(storagePercent, 1) + '%';

  const gpuDevices = gpu?.gpus || [];
  const gpuMax = gpuDevices.reduce((maximum, device) => {
    const value = Number(device.utilization_gpu_percent);
    return Number.isFinite(value) ? Math.max(maximum, value) : maximum;
  }, 0);
  const gpuRows = gpuDevices.map((device, index) => {
    const utilization = device.utilization_gpu_percent;
    const memoryPercent = percentOf(device.memory_used_mib, device.memory_total_mib);
    return `<div class="metric-pair"><span>GPU ${fmt(index)}</span><strong>${utilization == null ? '—' : fmt(utilization) + '%'}</strong></div>
      ${bar(utilization)}
      <div class="metric-pair"><span>Memory</span><strong>${device.memory_total_mib ? fmt(device.memory_used_mib) + ' / ' + fmt(device.memory_total_mib) + ' MiB' : '—'}</strong></div>
      ${device.memory_total_mib ? bar(memoryPercent) : ''}`;
  }).join('');

  const networkRows = (net?.interfaces || []).slice(0, 4).map(nic => `
    <div class="network-row">
      <span class="interface" title="${esc(nic.name)}">${esc(nic.name)}</span>
      <span>${fmtRate(nic.rx_bps)}↓&nbsp; ${fmtRate(nic.tx_bps)}↑</span>
    </div>`).join('');

  const source = mirrored ? '<div class="hardware-source muted">Mock node · local orchestrator hardware</div>' : '';
  const errors = (node.errors || []).map(error => `<div class="notice err">${esc(error)}</div>`).join('');
  return `${source}<div class="hardware-grid">
    <section class="hw-card cpu">
      <div class="hw-card-head"><span class="hw-card-title">CPU · ${fmt(cores.length)} threads</span><span class="hw-card-value">${cpuLabel}</span></div>
      <canvas id="thread-graph" class="thread-graph" width="560" height="${threadHeight}" style="height:${threadHeight}px" role="img" aria-label="Per-thread CPU utilization history"></canvas>
      <div class="thread-strip">${threadCells || '<span class="hw-empty">Waiting for per-thread samples</span>'}</div>
      <div class="hw-card-subtitle">Load 1 / 5 / 15 min&nbsp; ${load}</div>
    </section>
    <section class="hw-card memory">
      <div class="hw-card-head"><span class="hw-card-title">Memory</span><span class="hw-card-value">${memoryLabel}</span></div>
      ${bar(memoryPercent)}
      <div class="metric-pair"><span>Used</span><strong>${fmtBytes(memory?.used_bytes)} / ${fmtBytes(memory?.total_bytes)}</strong></div>
      <div class="metric-pair"><span>Available</span><strong>${fmtBytes(memory?.available_bytes)}</strong></div>
      <div class="metric-pair"><span>Swap</span><strong>${swapPercent == null ? '—' : fmt(swapPercent, 1) + '%'}</strong></div>
      <div class="metric-pair"><span>PSI some · 10s</span><strong class="pressure-value ${pressureTone(memoryPressure)}">${memoryPressure == null ? '—' : fmt(memoryPressure, 2) + '%'}</strong></div>
    </section>
    <section class="hw-card storage">
      <div class="hw-card-head"><span class="hw-card-title">Storage · ${esc(filesystem?.mount || '/')}</span><span class="hw-card-value">${storageLabel}</span></div>
      ${bar(storagePercent)}
      <div class="metric-pair"><span>Used</span><strong>${fmtBytes(filesystem?.used_bytes)} / ${fmtBytes(filesystem?.total_bytes)}</strong></div>
      <div class="metric-pair"><span>Available</span><strong>${fmtBytes(filesystem?.available_bytes)}</strong></div>
      <div class="metric-pair"><span>I/O PSI · 10s</span><strong class="pressure-value ${pressureTone(ioPressure)}">${ioPressure == null ? '—' : fmt(ioPressure, 2) + '%'}</strong></div>
    </section>
    <section class="hw-card gpu">
      <div class="hw-card-head"><span class="hw-card-title">GPU · ${fmt(gpuDevices.length)} devices</span><span class="hw-card-value">${gpuDevices.length ? fmt(gpuMax) + '%' : '—'}</span></div>
      ${gpuRows || '<div class="hw-empty">No GPU telemetry</div>'}
    </section>
    <section class="hw-card network">
      <div class="hw-card-head"><span class="hw-card-title">Network</span><span class="hw-card-value">${fmt(net?.interfaces?.length || 0)}</span></div>
      <div class="network-list">${networkRows || '<div class="hw-empty">No interface telemetry</div>'}</div>
    </section>
  </div>${errors}`;
}

function drawThreadGraph(history, currentCores) {
  requestAnimationFrame(() => {
    const canvas = document.getElementById('thread-graph');
    if (!canvas) return;
    const ratio = Math.max(1, window.devicePixelRatio || 1);
    const rect = canvas.getBoundingClientRect();
    const width = Math.max(1, Math.round(rect.width));
    const height = Math.max(1, Math.round(rect.height));
    const pixelWidth = Math.round(width * ratio), pixelHeight = Math.round(height * ratio);
    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
    }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    const styles = getComputedStyle(document.documentElement);
    const background = styles.getPropertyValue('--bg').trim() || '#00060c';
    const divider = styles.getPropertyValue('--divider').trim() || '#0d2c4a';
    const foreground = styles.getPropertyValue('--ok').trim() || '#00d400';
    ctx.globalAlpha = 1;
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, width, height);

    const threadCount = Math.max(currentCores.length, ...history.map(point => point.cpu_cores_percent?.length || 0));
    if (!threadCount) return;
    const rowHeight = height / threadCount;
    ctx.fillStyle = divider;
    for (let row = 1; row < threadCount; row += 1) {
      ctx.fillRect(0, Math.floor(row * rowHeight), width, 1);
    }
    const slot = 2;
    const points = history
      .map(point => point.cpu_cores_percent || [])
      .slice(-Math.floor(width / slot));
    if (!points.length) points.push(currentCores);
    ctx.fillStyle = foreground;
    points.forEach((values, pointIndex) => {
      const x = width - (points.length - pointIndex) * slot;
      values.forEach((value, threadIndex) => {
        if (value == null || !Number.isFinite(Number(value))) return;
        const utilization = Math.max(0, Math.min(100, Number(value)));
        ctx.globalAlpha = 0.10 + utilization * 0.009;
        const y = Math.ceil(threadIndex * rowHeight);
        ctx.fillRect(x, y, slot, Math.max(1, Math.floor(rowHeight) - 1));
      });
    });
    ctx.globalAlpha = 1;
  });
}

function rosterSortControls(key, label) {
  return `<span class="roster-sort-controls">
    <button type="button" class="roster-sort-button" data-sort="${key}" data-direction="asc" aria-label="Sort ${label} ascending" title="Sort ${label} ascending" aria-pressed="${rosterSort.key === key && rosterSort.direction === 'asc'}">↑</button>
    <button type="button" class="roster-sort-button" data-sort="${key}" data-direction="desc" aria-label="Sort ${label} descending" title="Sort ${label} descending" aria-pressed="${rosterSort.key === key && rosterSort.direction === 'desc'}">↓</button>
  </span>`;
}

function compareRosterValues(left, right) {
  const leftMissing = left == null || left === '';
  const rightMissing = right == null || right === '';
  if (leftMissing || rightMissing) return leftMissing === rightMissing ? 0 : leftMissing ? 1 : -1;
  if (typeof left === 'number' && typeof right === 'number') return left - right;
  if (typeof left === 'boolean' && typeof right === 'boolean') return Number(left) - Number(right);
  return String(left).localeCompare(String(right), undefined, { numeric: true, sensitivity: 'base' });
}

function isLegacyHardwareSampler(actor) {
  const actorType = String(actor.actor_type || '');
  return (actorType.includes('BlockingSamplerActor') && actorType.includes('telemetry::hardware'))
    || /Host(?:Cpu|Gpu|Net)SamplerActor/.test(actorType);
}

function renderRoster(node) {
  const wrap = document.getElementById('roster-wrap');
  if (!wrap) return;
  let rows = [...(node.roster || [])];
  if (hardwareSource === 'orchestrator') {
    // Mock containers may come from an older local image. Current samplers are
    // engine tasks; do not leak legacy sampler actors into the simulated roster.
    rows = rows.filter(actor => !isLegacyHardwareSampler(actor));
    const actorCount = document.querySelector('[data-actor-count]');
    if (actorCount) actorCount.textContent = fmt(rows.length);
  }
  if (rosterFilter) {
    const q = rosterFilter.toLowerCase();
    rows = rows.filter(a => `${a.name || ''} ${a.actor_type || ''} ${a.address} ${a.worker_id ?? ''}`.toLowerCase().includes(q));
  }
  rows.sort((left, right) => {
    const compared = compareRosterValues(left[rosterSort.key], right[rosterSort.key]);
    return (rosterSort.direction === 'asc' ? compared : -compared)
      || String(left.address).localeCompare(String(right.address));
  });
  const capped = rows.slice(0, ROSTER_RENDER_CAP);
  const notice = rows.length > capped.length
    ? `<div class="notice">showing ${fmt(capped.length)} of ${fmt(rows.length)} — refine the filter to see more</div>`
    : '';
  let html;
  if (!rows.length) {
    html = '<div class="empty">No actors on this stream (or none match the filter).</div>';
  } else {
    html = notice + `<table>
    <thead><tr><th>Actor${rosterSortControls('address', 'actor')}</th><th>Type${rosterSortControls('actor_type', 'type')}</th><th>State${rosterSortControls('poisoned', 'state')}</th><th>Mailbox${rosterSortControls('mailbox_depth', 'mailbox')}</th><th>Msg/s${rosterSortControls('msg_per_sec', 'throughput')}</th><th>Processed${rosterSortControls('messages_processed', 'processed count')}</th><th>Worker${rosterSortControls('worker_id', 'worker')}</th><th>Last message${rosterSortControls('last_msg_type', 'last message')}</th></tr></thead>
    <tbody>${capped.map(a => `<tr data-addr="${esc(a.address)}" tabindex="0" ${a.address === selectedActor ? 'data-selected="true"' : ''}>
      <td class="mono">${esc(shortAddr(a.address))}${a.name ? `<br><span class="muted">${esc(a.name)}</span>` : ''}</td>
      <td><span class="muted" title="${esc(a.actor_type || '')}">${typeShort(a.actor_type)}</span></td>
      <td>${a.poisoned ? '<span class="pill poisoned">poisoned</span>' : '<span class="muted">running</span>'}</td>
      <td data-mailbox></td>
      <td data-rate></td>
      <td data-processed></td>
      <td>${a.worker_id == null ? '—' : fmt(a.worker_id)}</td>
      <td><span class="muted" data-last-message></span><br><span class="muted" data-last-active></span></td>
    </tr>`).join('')}</tbody>
  </table>`;
  }
  if (html !== lastRosterHtml) {
    wrap.innerHTML = html;
    lastRosterHtml = html;
  }
  updateRosterTexts(wrap, capped);
}

function updateRosterTexts(wrap, actors) {
  const byAddress = new Map(actors.map(actor => [actor.address, actor]));
  for (const row of wrap.querySelectorAll('tr[data-addr]')) {
    const actor = byAddress.get(row.getAttribute('data-addr'));
    if (!actor) continue;
    row.querySelector('[data-mailbox]').textContent = fmt(actor.mailbox_depth);
    row.querySelector('[data-rate]').textContent = fmtRate(actor.msg_per_sec);
    row.querySelector('[data-processed]').textContent = fmt(actor.messages_processed);
    const last = row.querySelector('[data-last-message]');
    const messageType = actor.last_msg_type || '';
    last.title = messageType;
    const parts = String(messageType).split('::');
    last.textContent = messageType ? parts[parts.length - 1] || messageType : '—';
    row.querySelector('[data-last-active]').textContent = actor.last_active_ms_ago == null
      ? 'never active'
      : `${ago(actor.last_active_ms_ago)} ago`;
  }

}

function shortAddr(address) {
  const s = String(address || '');
  return s.length > 14 ? s.slice(0, 8) + '…' + s.slice(-4) : s;
}

function stopDetailPolling() {
  if (detailTimer) { clearInterval(detailTimer); detailTimer = null; }
}

function startDetailPolling() {
  stopDetailPolling();
  let pollInFlight = false;
  const poll = async () => {
    if (!selectedStream || !selectedActor || pollInFlight) return;
    pollInFlight = true;
    try {
      const response = await fetch(`/api/view/fleet/detail?stream=${encodeURIComponent(selectedStream)}&actor=${encodeURIComponent(selectedActor)}`);
      if (!response.ok) { stopDetailPolling(); return; }
      const detail = await response.json();
      renderDossier(detail);
    } catch {
      // Keep the current dossier while the next scheduled refresh retries.
    } finally {
      pollInFlight = false;
    }
  };
  poll();
  detailTimer = setInterval(poll, POLL_MS);
}

function renderDossier(d) {
  const slot = document.getElementById('dossier-slot');
  if (!slot) return;

  const diet = (d.message_type_counts || []).slice().sort((a, b) => b.count - a.count);
  const dietMax = Math.max(1, ...diet.map(x => x.count));
  const lastName = d.last_msg_type;
  const dietHtml = diet.length ? diet.map(x => `
    <div class="bar-row"><span class="name" title="${esc(x.message_type)}">${esc(x.message_type)}</span>
    <div class="bar-track"><div class="bar-fill" style="width:${(x.count / dietMax * 100).toFixed(1)}%"></div></div>
    <span class="num">${fmt(x.count)}</span></div>`).join('')
    : '<div class="empty">no message-type counts on frame</div>';
  const receipts = (d.receipts || []).slice().reverse();
  const receiptsHtml = receipts.length ? `<table class="receipts">
      <thead><tr><th>When</th><th>Message type</th><th>Folded</th></tr></thead>
      <tbody>${receipts.map(r => `<tr>
        <td class="muted">${agoSpan(Date.now() - r.ms_ago)} ago</td>
        <td><span class="mono" title="${esc(r.ty)}">${typeShort(r.ty)}</span></td>
        <td class="muted">${r.folded ? '+' + fmt(r.folded) + ' sampled' : '—'}</td>
      </tr>`).join('')}</tbody>
    </table>
    <div class="notice">showing last ${fmt(receipts.length)} receipts · ${fmt(d.sampled_out)} messages sampled out · ${fmt(d.messages_processed)} processed total</div>`
    : '<div class="empty">no message receipts folded yet</div>';
  const html = `<section class="panel dossier">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
      <h2 style="margin:0">${typeShort(d.actor_type)} <span class="muted mono" style="font-size:12px">${esc(shortAddr(d.address))}</span></h2>
      <button id="dossier-close" aria-label="Close dossier" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px">×</button>
    </div>
    <div class="kv" style="margin-top:10px">
      <span class="k">node</span><span>${esc(d.stream.node)}</span>
      <span class="k">address</span><span class="mono">${esc(d.address)}</span>
      ${d.name ? `<span class="k">name</span><span>${esc(d.name)}</span>` : ''}
      <span class="k">actor type</span><span class="mono" title="${esc(d.actor_type || '')}">${esc(d.actor_type || '—')}</span>
      <span class="k">message type</span><span class="mono" title="${esc(d.message_type || '')}">${esc(d.message_type || '—')}</span>
      <span class="k">state</span><span>${d.poisoned ? '<span class="pill poisoned">poisoned</span>' : 'running'}</span>
      <span class="k">worker</span><span>${d.worker_id == null ? '—' : fmt(d.worker_id)}</span>
      <span class="k">mailbox</span><span>${fmt(d.mailbox_depth)} (${d.mailbox_growth >= 0 ? '+' : ''}${fmtRate(d.mailbox_growth)}/s)</span>
      <span class="k">throughput</span><span>${fmtRate(d.msg_per_sec)} msg/s</span>
      <span class="k">processed</span><span>${fmt(d.messages_processed)}</span>
      <span class="k">last message</span><span class="mono" title="${esc(d.last_msg_type || '')}">${esc(d.last_msg_type || '—')}</span>
      <span class="k">last active</span><span>${d.last_active_ms_ago == null ? 'never' : `${ago(d.last_active_ms_ago)} ago`}</span>
    </div>
    <h2>Throughput</h2>
    <canvas id="dossier-spark" width="380" height="64"></canvas>
    <h2>Message diet</h2>
    <div class="diet">${dietHtml}</div>
    <h2>Message history</h2>
    ${receiptsHtml}
  </section>`;
  if (html !== lastDossierHtml) {
    slot.innerHTML = html;
    lastDossierHtml = html;
  }
  const history = d.history || [];
  const canvas = document.getElementById('dossier-spark');
  if (canvas && history.length > 1) {
    const ctx = canvas.getContext('2d');
    drawLine(ctx, history.map(h => h.msg_per_sec), '#60a5fa');
  }
  updateAgo();
}


// A2: delegation on the persistent #page container. Cards, roster rows and
// the dossier close button are rebuilt by render passes; listeners bound at
// startup mean a press straddling a rebuild still lands on the right target.
const pageEl = document.getElementById('page');
pageEl.addEventListener('click', e => {
  if (e.target.closest('#dossier-close')) {
    selectedActor = null;
    pushUrl();
    render();
    return;
  }
  const sortButton = e.target.closest('.roster-sort-button');
  if (sortButton) {
    rosterSort = { key: sortButton.dataset.sort, direction: sortButton.dataset.direction };
    render();
    return;
  }
  const rosterRow = e.target.closest('tr[data-addr]');
  if (rosterRow) {
    selectedActor = rosterRow.getAttribute('data-addr');
    pushUrl();
    render();
    return;
  }
  const card = e.target.closest('a.node-card');
  if (card) {
    e.preventDefault();
    selectedStream = card.getAttribute('data-stream');
    selectedActor = null;
    pushUrl();
    render();
  }
});
pageEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const rosterRow = e.target.closest('tr[data-addr]');
  if (rosterRow) {
    selectedActor = rosterRow.getAttribute('data-addr');
    pushUrl();
    render();
  }
});
refresh();
setInterval(refresh, POLL_MS);
</script>
