[package]
name = "distribution"
version = "0.1.0"
edition = "2024"

[dependencies]
swactor = { path = "../..", features = ["serde", "transport"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
