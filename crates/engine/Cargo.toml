[package]
name = "swactor-engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[dependencies]
parking_lot = "0.12"
tokio = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
swactor = { path = "../.." }

[target.'cfg(target_family = "wasm")'.dependencies]
swactor = { path = "../..", default-features = false, features = ["wasm", "std"] }
web-time = "1"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
