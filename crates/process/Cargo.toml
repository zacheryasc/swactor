[package]
name = "swactor-process"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
swactor = { path = "../..", default-features = false, features = ["no_random"] }
swactor-engine = { path = "../engine" }
tokio = { workspace = true, features = ["sync"] }
telemetry = { path = "../telemetry" }
crossbeam-queue = "0.3.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
parking_lot = "0.12"
proptest = "1"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Pipes"] }

[lints]
workspace = true
