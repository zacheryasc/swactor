[package]
name = "runtime-dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
swactor = { path = "../..", features = ["serde", "tracing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
