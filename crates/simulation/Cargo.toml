[package]
name = "simulation"
version = "0.1.0"
edition = "2024"

[features]
default = []
gossip = ["dep:log"]

[dependencies]
distribution = { path = "../distribution" }
swactor = { path = "../..", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
log = { version = "0.4", optional = true }

[dev-dependencies]
simulation = { path = ".", features = ["gossip"] }

[[example]]
name = "gossip_sim"
required-features = ["gossip"]
