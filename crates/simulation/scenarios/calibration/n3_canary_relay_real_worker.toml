# Calibration scenario paired with bundle `vastai-N3-1`.
# RELAY_SPEC §10.1.
#
# Topology: three SWIM/stage hosts (orchestrator + two pipeline stages)
# routed through one relay. The relay's policy mimics the n0 canary
# cluster as observed in run #1: very low egress per link, a large
# shared queue, and a multi-hundred-millisecond cold-start. Stage hosts
# carry the worker-exit timing observed in the bundle (51s / 75s / 191s
# in run #1's siblings; this scenario uses the most aggressive 51s
# value because it is the assertion that bites first).
#
# Expected verdict on the as-shipped relay policy: `relay_queue_depth_bounded`
# Fails (the canary relay's queue grows past the bound at multi-kilobyte
# gossip volumes — RELAY_SPEC §10.2 "calibration scenario"); the run's
# stage worker_exits surface the C.3 finding deterministically.
#
# The relay topology was calibrated as part of the SWIM tuning pass
# (see `crates/simulation/SWIM_TUNING_REPORT.md` §3). The N3 #1
# bundle records a 9.87 KB Ack buffered behind the canary for 187 s,
# giving an effective drain rate of ≈ 53 B/s ≈ 425 bps; the
# `egress_capacity_bps_per_link = 100` setting below is in the same
# decade. The `max_bytes` assertion bound was tightened from a
# placeholder 64 KB to 1.5 KB so the cumulative buffering signature
# fires under realistic gossip rates. Other numeric fields (link
# latency, jitter, bandwidth) are still placeholder-grade until a
# §11.3 follow-up pass calibrates them against the live bundle.

name = "n3_canary_relay_real_worker"
seed = 1
duration_ns = 425_000_000_000  # 425 s — the live run's duration

[default_tick]
period_ns = 200_000_000  # 200 ms

[default_link]
latency_ns = 60_000_000           # 60 ms one-way, multi-region
jitter_stddev_ns = 15_000_000     # 15 ms
loss_prob_ppm = 0
reorder_prob_ppm = 0
bandwidth_bps = 25_000_000        # 25 Mb/s
cold_dial_penalty_ns = 200_000_000
cache_warm_after_ns = 200_000_000
cache_invalidate_after_idle_ns = 30_000_000_000

# Canary relay policy. Calibrated to reproduce the 187-second
# buffering pathology observed at t=556598..743981 in `vastai-N3-1`.
# The bottleneck is per-link egress: when the relay's outbound
# bandwidth per outbound host falls below the cluster's aggregate
# SWIM gossip rate, messages back up behind the slowest leg.
# 100 bps/link approximates the drain rate implied by the live
# bundle's "9.87 KB Ack buffered 187 s" measurement (≈ 425 bps) and
# reproduces the cumulative buffering signature without claiming a
# specific Mb/s number we have not measured directly.
[[relays]]
id = "canary"
ingress_capacity_bps = 100_000_000             # 100 Mb/s combined ingress
egress_capacity_bps_per_link = 100             # 100 bps per outbound link — the bottleneck
queue_depth_bytes = 524_288                    # 512 KB shared egress buffer
cold_start_penalty_ns = 500_000_000            # 500 ms first-message warmup

[[peers]]
id = "orchestrator"
kind = "swim"
initial_state = "alive"
# Mirrors `SwimConfig::default()` at the scenario's 200 ms tick:
# probe_interval = 10 ticks = 2 s, probe_timeout = 15 ticks = 3 s,
# suspicion_timeout = 75 ticks = 15 s, indirect_ping_fanout = 2.
kind_config = { probe_interval_ns = 2_000_000_000, probe_timeout_ns = 3_000_000_000, suspicion_timeout_ns = 15_000_000_000, indirect_ping_fanout = 2 }

[[peers]]
id = "stage_0"
kind = "stage"
initial_state = "cold"
kind_config = { name = "pp-stage-0", address = "10.0.0.10:7700" }

[[peers]]
id = "stage_1"
kind = "stage"
initial_state = "cold"
kind_config = { name = "pp-stage-1", address = "10.0.0.11:7700" }

# Every host pair routes through the canary relay.
[[links]]
from = "orchestrator"
to = "stage_0"
via = "canary"
[[links]]
from = "stage_0"
to = "orchestrator"
via = "canary"
[[links]]
from = "orchestrator"
to = "stage_1"
via = "canary"
[[links]]
from = "stage_1"
to = "orchestrator"
via = "canary"
[[links]]
from = "stage_0"
to = "stage_1"
via = "canary"
[[links]]
from = "stage_1"
to = "stage_0"
via = "canary"

# Stage worker_exits at the live timings (RELAY_SPEC §5.3 / C.3 of the
# deployment report). Used by `worker_alive_throughout` below.
[[mutations]]
at_ns = 51_000_000_000   # 51 s — the earliest of the live worker exits
kind = "worker_exit"
peer = "stage_0"
reason = "tinygrad worker crashed (placeholder)"
status_code = 1

[[mutations]]
at_ns = 191_000_000_000  # 191 s — second stage exits later
kind = "worker_exit"
peer = "stage_1"
reason = "tinygrad worker crashed (placeholder)"
status_code = 1

# Snapshots scattered so `name_resolves_within` can observe registry
# convergence — or its absence.
[[snapshots]]
at_ns = 1_000_000_000
[[snapshots]]
at_ns = 10_000_000_000
[[snapshots]]
at_ns = 50_000_000_000
[[snapshots]]
at_ns = 200_000_000_000
[[snapshots]]
at_ns = 400_000_000_000

# RELAY_SPEC §7.1 assertions over the calibration run.
#
# `relay_queue_depth_bounded` is the load-bearing assertion: under the
# canary relay's policy, cumulative gossip pushes `enqueued_bytes`
# past the bound, mirroring the 187-second buffering signature.
[[assertions]]
kind = "relay_queue_depth_bounded"
relay = "canary"
max_bytes = 1_500  # 1.5 KB — calibrated bound. The own-relay
                   # scenarios peak around 1280 B on a single in-flight
                   # gossip message. The canary's 100 bps per-link
                   # egress lets at least three SWIM gossips back up
                   # behind the slow leg, putting the canary's peak
                   # above the bound. The pre-calibration placeholder
                   # (65_536 B) never fired because the relay's 1 Mb/s
                   # egress drained gossip an order of magnitude faster
                   # than the cluster produced it.

# `worker_alive_throughout` over the first minute fails on stage_0's
# 51s exit, which the deployment report calls out as the canonical
# Layer C symptom.
[[assertions]]
kind = "worker_alive_throughout"
peer = "stage_0"
window_start_ns = 0
window_end_ns = 60_000_000_000

# Name registry convergence: orchestrator should learn pp-stage-0
# within the resolve deadline. Under the canary buffering this is the
# observable that fails — `pp-entry never resolves` in the live run.
[[assertions]]
kind = "name_resolves_within"
name = "pp-stage-0"
observers = ["orchestrator"]
within_ns = 30_000_000_000
from_ns = 0
