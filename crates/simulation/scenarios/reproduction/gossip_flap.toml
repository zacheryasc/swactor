# Reproduces the SWIM gossip-flap bug from the N3 deployment report
# (B1) on the current production source. Under multi-region latency the
# orchestrator's incarnation counter explodes from rebutted Suspect
# claims piggybacked through routine gossip.
#
# How the dynamic fires here, in plain English:
#
# 1. Probe timeout (100ms) is shorter than the link round-trip
#    (~120ms one-way × 2 + jitter), so every direct probe ack arrives
#    after its timeout. The probe state machine fans out to indirect
#    probes; those round-trip even slower (relay → target → relay →
#    sender) and time out as well.
# 2. Each peer therefore concludes its neighbour is Suspect, enqueues
#    that into its dissemination buffer, and piggybacks the claim onto
#    every outgoing ping until the entry expires.
# 3. The orchestrator receives a piggybacked Suspect{orchestrator}
#    from worker_a or worker_b, applies the membership update against
#    its own NodeId, and `apply_membership_update`
#    (crates/distribution/src/swim/node.rs) refutes by bumping
#    `self_incarnation`. The new Alive{orchestrator, n} is enqueued
#    for dissemination, so the next probe carries it. Some peers
#    catch the refute; others have already piggybacked the *old*
#    Suspect onward by then, so a fresh refute fires next cycle.
#
# Expected verdict on the current SWIM source: `self_incarnation_bounded`
# Fails (max_value=2, observed many bumps over 20 simulated seconds).
# The proposed fix (re-evaluate Suspect{self} against the latest
# incarnation before refuting; drop stale piggybacks) should bring the
# verdict back to Pass without other assertions regressing.

name = "gossip_flap_repro"
seed = 42
duration_ns = 20_000_000_000  # 20 simulated seconds — enough for many cycles

# 50ms ticks let probe_timeout sit below the link round-trip without
# fighting the integer tick floor.
[default_tick]
period_ns = 50_000_000

[default_link]
latency_ns = 60_000_000           # 60ms one-way, multi-region
jitter_stddev_ns = 15_000_000     # 15ms — occasional spikes above probe_timeout
loss_prob_ppm = 5_000             # 0.5% loss — small extra perturbation
reorder_prob_ppm = 0
bandwidth_bps = 25_000_000        # 25 Mb/s
cold_dial_penalty_ns = 200_000_000
cache_warm_after_ns = 200_000_000
cache_invalidate_after_idle_ns = 10_000_000_000

# Tight probe_timeout (100ms ≈ 2 ticks) below the RTT (~120ms+jitter)
# is what reliably trips the bug — without it, the dynamic depends on
# rare loss events and is not reliably reproducible per-run.
[[peers]]
id = "orchestrator"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 100_000_000, suspicion_timeout_ns = 2_000_000_000 }
[[peers]]
id = "worker_a"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 100_000_000, suspicion_timeout_ns = 2_000_000_000 }
[[peers]]
id = "worker_b"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 100_000_000, suspicion_timeout_ns = 2_000_000_000 }

[[links]]
from = "orchestrator"
to = "worker_a"
[[links]]
from = "worker_a"
to = "orchestrator"
[[links]]
from = "orchestrator"
to = "worker_b"
[[links]]
from = "worker_b"
to = "orchestrator"
[[links]]
from = "worker_a"
to = "worker_b"
[[links]]
from = "worker_b"
to = "worker_a"

# Snapshots every 2 simulated seconds — the §10 evaluator reads
# `self_incarnation` off these for `self_incarnation_bounded`.
[[snapshots]]
at_ns = 2_000_000_000
[[snapshots]]
at_ns = 4_000_000_000
[[snapshots]]
at_ns = 6_000_000_000
[[snapshots]]
at_ns = 8_000_000_000
[[snapshots]]
at_ns = 10_000_000_000
[[snapshots]]
at_ns = 12_000_000_000
[[snapshots]]
at_ns = 14_000_000_000
[[snapshots]]
at_ns = 16_000_000_000
[[snapshots]]
at_ns = 18_000_000_000
[[snapshots]]
at_ns = 19_500_000_000

# The bound: under the production source, the orchestrator rebuts
# enough piggybacked Suspect claims to far exceed 2. A passing fix
# keeps self_incarnation at most 2 (one initial 0→1 bootstrap bump is
# the most that should ever happen in a clean cluster).
[[assertions]]
kind = "self_incarnation_bounded"
peer = "orchestrator"
max_value = 2

# Companion assertions from the §10 catalog. They cover the same bug
# from a different angle and are kept for forward-compatibility once
# the host adapter starts emitting `probe_sent` / `probe_received`
# events that drive the probes-ok gate. Today the SWIM host does not
# (it emits production diag events under a single `diag_event`
# envelope per §6.2), so these resolve to Inconclusive — the §10.5
# "Inconclusive when preconditions don't fire" arm. They are not
# load-bearing for the reproduction.
[[assertions]]
kind = "no_flap_while_probes_ok"
peer = "orchestrator"
window_start_ns = 5_000_000_000
window_end_ns = 20_000_000_000

[[assertions]]
kind = "no_dead_when_probes_ok"
peer = "worker_a"
window_start_ns = 5_000_000_000
window_end_ns = 20_000_000_000
