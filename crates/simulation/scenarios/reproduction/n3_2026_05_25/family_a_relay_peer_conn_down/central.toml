# Family A central case — relay-mediated peer-connection drop with
# surviving tunnel (`N3_SIM_TEST_BATTERY_SPEC.md §3 family A`).
#
# Three SWIM peers (orch, stage-0, stage-2) routed through a single
# relay `R`. At +5 s, `RelayPeerConnDown { from: orch, to: stage-2 }`
# cuts the relay→stage-2 leg permanently. The relay stays functional
# for every other peer pair: stage-2's tunnel to R survives, but the
# orchestrator's relay-mediated sends to stage-2 silently drop.
#
# Expected verdict on the current SWIM source: `no_flap_while_probes_ok`
# Fail. This is the deployment's actual failure mode — stage-2's SWIM
# state machine cannot tell "my tunnel is healthy" from "my peers can
# reach me through it." The battery's job is to prove the failure is
# observable as a verdict; the fix is a downstream SWIM change.

name = "n3_family_a_central_relay_peer_conn_down"
seed = 1
duration_ns = 30_000_000_000  # 30 s — well past the cut at +5 s

[default_tick]
period_ns = 50_000_000  # 50 ms ticks

# Multi-hundred-millisecond relay-mediated RTT mirrors the
# `1779733878` tier-2 distribution. The §3 family A scenario fires
# the cut into a path that was succeeding at this latency.
[default_link]
latency_ns = 200_000_000        # 200 ms one-way
jitter_stddev_ns = 50_000_000   # 50 ms — relay-side HOL queueing
loss_prob_ppm = 0
reorder_prob_ppm = 0
bandwidth_bps = 25_000_000
cold_dial_penalty_ns = 200_000_000
cache_warm_after_ns = 200_000_000
cache_invalidate_after_idle_ns = 30_000_000_000

[[relays]]
id = "R"
ingress_capacity_bps = 1_000_000_000
egress_capacity_bps_per_link = 100_000_000
queue_depth_bytes = 65_536
cold_start_penalty_ns = 0

# SwimConfig at the scenario's 50 ms tick: probe_interval=10 ticks
# (500 ms), probe_timeout=15 ticks (750 ms), suspicion_timeout=75
# ticks (3.75 s), indirect_ping_fanout=2.
[[peers]]
id = "orch"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 750_000_000, suspicion_timeout_ns = 3_750_000_000, indirect_ping_fanout = 2 }
[[peers]]
id = "stage-0"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 750_000_000, suspicion_timeout_ns = 3_750_000_000, indirect_ping_fanout = 2 }
[[peers]]
id = "stage-2"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 750_000_000, suspicion_timeout_ns = 3_750_000_000, indirect_ping_fanout = 2 }

# Full mesh via R — `conn_type=Relay` everywhere matches the
# `1779733878` topology (no hole-punching).
[[links]]
from = "orch"
to = "stage-0"
via = "R"
[[links]]
from = "stage-0"
to = "orch"
via = "R"
[[links]]
from = "orch"
to = "stage-2"
via = "R"
[[links]]
from = "stage-2"
to = "orch"
via = "R"
[[links]]
from = "stage-0"
to = "stage-2"
via = "R"
[[links]]
from = "stage-2"
to = "stage-0"
via = "R"

# The fault. `duration_ns = 0` is permanent until run end (spec §3
# family A central case). Cut the orchestrator→stage-2 leg only;
# direction is one axis (axes 1.3).
[[mutations]]
at_ns = 5_000_000_000
kind = "relay_peer_conn_down"
relay = "R"
from = "orch"
to = "stage-2"

# Snapshots one virtual nanosecond before and after the fault per
# spec §2: bundle readers see the state on each side of the
# transition.
[[snapshots]]
at_ns = 1_000_000_000
[[snapshots]]
at_ns = 4_999_999_999
[[snapshots]]
at_ns = 5_000_000_001
[[snapshots]]
at_ns = 10_000_000_000
[[snapshots]]
at_ns = 20_000_000_000
[[snapshots]]
at_ns = 29_000_000_000

# Required assertion: stage-2 must not flap while probes-OK
# (spec §3 family A). The post-cut window is +5 s through end of run.
# Expected: Fail on current source — the SWIM state machine cannot
# distinguish "my tunnel is healthy" from "my peers can reach me."
[[assertions]]
kind = "no_flap_while_probes_ok"
peer = "stage-2"
window_start_ns = 5_000_000_000
window_end_ns = 30_000_000_000

# Required assertion (spec §3 family A): the cut must produce at
# least one observable probe lifecycle event. The orch's relay-
# mediated path to stage-2 dies at +5 s, so every probe attempt to
# stage-2 thereafter expires its budget — at minimum one
# `swim_probe_timed_out` lands in the bundle. This is the family's
# "the cut produces an observable signal" close criterion in its
# evaluator-expressible form. Now possible thanks to the
# `EventCount { min: ... }` catalog extension landed alongside
# this scenario tightening.
[[assertions]]
kind = "event_count"
event_kind = "swim_probe_timed_out"
min = 1
