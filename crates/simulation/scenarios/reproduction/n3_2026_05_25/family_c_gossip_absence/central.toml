# Family C central case — gossip-arrival absence with a control-plane
# vs data-plane discriminator (`N3_SIM_TEST_BATTERY_SPEC.md §3 family C`).
#
# Three SWIM peers. A `Partition` mutation at +500 ms isolates
# `stage-2` from `stage-0` at the network-graph layer (no edges
# either direction). The orchestrator's path to each stage stays
# open. The bundle's gossip-receipts and dial-outcome surfaces should
# tell a bundle reader, in one read, whether gossip about stage-0
# ever reached stage-2 (and vice versa).
#
# Expected verdict on current source: Pass on `self_incarnation_bounded`
# (the partition does not flap the orchestrator's incarnation under
# the tuned SWIM defaults). The family's load-bearing claim — that
# the bundle distinguishes control-plane from data-plane failures —
# is asserted by the post-processor's existing surfaces rather than
# by a typed assertion (see family README for the catalog gap).

name = "n3_family_c_central_gossip_absence"
seed = 3
duration_ns = 15_000_000_000  # 15 s

[default_tick]
period_ns = 50_000_000  # 50 ms

[default_link]
latency_ns = 60_000_000
jitter_stddev_ns = 15_000_000
loss_prob_ppm = 0
reorder_prob_ppm = 0
bandwidth_bps = 25_000_000
cold_dial_penalty_ns = 200_000_000
cache_warm_after_ns = 200_000_000
cache_invalidate_after_idle_ns = 30_000_000_000

[[relays]]
id = "R"
ingress_capacity_bps = 1_000_000_000
egress_capacity_bps_per_link = 100_000_000
queue_depth_bytes = 65_536
cold_start_penalty_ns = 0

[[peers]]
id = "orch"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 750_000_000, suspicion_timeout_ns = 3_750_000_000, indirect_ping_fanout = 2 }
[[peers]]
id = "stage-0"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 750_000_000, suspicion_timeout_ns = 3_750_000_000, indirect_ping_fanout = 2 }
[[peers]]
id = "stage-2"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 750_000_000, suspicion_timeout_ns = 3_750_000_000, indirect_ping_fanout = 2 }

[[links]]
from = "orch"
to = "stage-0"
via = "R"
[[links]]
from = "stage-0"
to = "orch"
via = "R"
[[links]]
from = "orch"
to = "stage-2"
via = "R"
[[links]]
from = "stage-2"
to = "orch"
via = "R"
[[links]]
from = "stage-0"
to = "stage-2"
via = "R"
[[links]]
from = "stage-2"
to = "stage-0"
via = "R"

# Isolate stage-2 from stage-0 — both sides. The orchestrator
# remains reachable from each.
[[mutations]]
at_ns = 500_000_000
kind = "partition"
peers_a = ["stage-0"]
peers_b = ["stage-2"]

[[snapshots]]
at_ns = 400_000_000
[[snapshots]]
at_ns = 600_000_000
[[snapshots]]
at_ns = 5_000_000_000
[[snapshots]]
at_ns = 10_000_000_000
[[snapshots]]
at_ns = 14_500_000_000

# Coarse upper bound on state-transition events: the partition
# causes SWIM churn (stage-0 ↔ stage-2 disagreement piggybacks
# through orch's gossip), but the run's total transitions stay
# well under 10_000 in a 15-second window. A regression in the
# simulator that flooded the bundle with transitions would break
# this bound and surface as a Fail.
[[assertions]]
kind = "event_count"
event_kind = "state_transition"
max = 10_000

# Per-peer discriminator (`EventCount.peer` filter, landed iter 6):
# at least one state_transition lands on stage-2's own event stream
# during the run. Validates the per-peer-filter surface itself —
# regressing the host_id field on emitted events would break this.
# The spec's literal contract (`event_count { kind:
# "GossipReceived", peer: stage-2, payload_kind: "NameRegistry",
# min: N }`) needs a sim emission of typed `GossipReceived` events
# under `swim_piggyback` semantics, which the current SWIM host
# adapter does not emit (gossip rides as piggyback bytes inside
# Ping/Ack messages, not as a typed event). state_transition is
# the closest available filter target the partition reliably
# triggers; the payload_kind filter awaits a sim S-layer extension
# of the swim_host's diag emission for GossipReceived.
[[assertions]]
kind = "event_count"
event_kind = "state_transition"
peer = "stage-2"
min = 1
