# Family D central case — asymmetric host reachability via
# `LossBurst` on the victim's host-level outbound links
# (`N3_SIM_TEST_BATTERY_SPEC.md §3 family D`).
#
# Three SWIM peers. At +2 s, a 30-second `LossBurst` on
# (stage-2 → orch) and (stage-2 → stage-0) drops 8% of stage-2's
# outbound packets. The mutation models stage-2's host network
# behaving correctly *most* of the time but exhibiting asymmetric
# loss in a pattern downstream iroh layers cannot distinguish from
# a relay-side or peer-software issue. The other peers' outbound
# links stay clean.
#
# Note: the §2 "all via R" default does not apply here per
# spec §2 ("Extreme cases that need direct edges declare them
# per `SIM_SPEC.md §8.1`"). Family D's loss models the host's
# kernel-level packet pathology, which is host-to-host, not
# relay-mediated.

name = "n3_family_d_central_loss_burst"
seed = 4
duration_ns = 40_000_000_000  # 40 s — covers the 30 s burst + tail

[default_tick]
period_ns = 50_000_000

[default_link]
latency_ns = 60_000_000
jitter_stddev_ns = 15_000_000
loss_prob_ppm = 0
reorder_prob_ppm = 0
bandwidth_bps = 25_000_000
cold_dial_penalty_ns = 200_000_000
cache_warm_after_ns = 200_000_000
cache_invalidate_after_idle_ns = 30_000_000_000

[[peers]]
id = "orch"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 750_000_000, suspicion_timeout_ns = 3_750_000_000, indirect_ping_fanout = 2 }
[[peers]]
id = "stage-0"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 750_000_000, suspicion_timeout_ns = 3_750_000_000, indirect_ping_fanout = 2 }
[[peers]]
id = "stage-2"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 750_000_000, suspicion_timeout_ns = 3_750_000_000, indirect_ping_fanout = 2 }

# Direct edges — host-to-host. Loss is applied at the host network
# level, not the relay.
[[links]]
from = "orch"
to = "stage-0"
[[links]]
from = "stage-0"
to = "orch"
[[links]]
from = "orch"
to = "stage-2"
[[links]]
from = "stage-2"
to = "orch"
[[links]]
from = "stage-0"
to = "stage-2"
[[links]]
from = "stage-2"
to = "stage-0"

# 8% loss on stage-2's outbound links for 30 s. Axis 1: outbound
# only — stage-2 cannot reliably send, but inbound traffic to it
# stays clean.
[[mutations]]
at_ns = 2_000_000_000
kind = "loss_burst"
links = [{ from = "stage-2", to = "orch" }, { from = "stage-2", to = "stage-0" }]
prob_ppm = 80_000
duration_ns = 30_000_000_000

[[snapshots]]
at_ns = 1_000_000_000
[[snapshots]]
at_ns = 5_000_000_000
[[snapshots]]
at_ns = 15_000_000_000
[[snapshots]]
at_ns = 30_000_000_000
[[snapshots]]
at_ns = 38_000_000_000

# Coarse incarnation bound — under 8% outbound loss the SWIM tuning
# should keep self_incarnation flat for the orchestrator (the loss
# falls on stage-2's sends, not the orch's). A regression surfaces
# as a bump.
[[assertions]]
kind = "self_incarnation_bounded"
peer = "orch"
max_value = 3

# Refute-on-Suspect discriminator: stage-2's outbound is dropping
# 8% of its acks during the burst, so orch / stage-0 will
# eventually Suspect stage-2; stage-2 will refute by bumping its
# self_incarnation. A scenario with the loss burst active must
# produce at least one bump on the victim — the Mixed verdict the
# spec calls for in §3 family D. The spec's literal discriminator
# (per-peer kernel-counter deltas in `## Kernel network drops`)
# is a catalog gap (filed in this family's README); the
# self-incarnation refute is the closest available proxy for the
# observation "the victim's outbound was lossy enough that the
# cluster noticed."
[[assertions]]
kind = "self_incarnation_bounded"
peer = "stage-2"
max_value = 0
