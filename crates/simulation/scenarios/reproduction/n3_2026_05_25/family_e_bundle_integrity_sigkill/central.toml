# Family E central case — bundle integrity under operator SIGKILL
# (`N3_SIM_TEST_BATTERY_SPEC.md §3 family E`).
#
# Three SWIM peers. At +5 s, `PeerKill { peer: orch }` halts the
# orchestrator. The scenario runs 5 s past the kill so the
# collector has time to observe and the bundle can coalesce. The
# scenario's test driver verifies the bundle:
#   - `manifest.json` exists with `finalize_received: false` for orch
#   - pre-kill events and snapshots for every peer are present
#   - `verdicts.json` contains a verdict for every declared assertion

name = "n3_family_e_central_sigkill_orchestrator"
seed = 5
duration_ns = 10_000_000_000  # 10 s — kill at +5 s, 5 s tail

[default_tick]
period_ns = 50_000_000

[default_link]
latency_ns = 60_000_000
jitter_stddev_ns = 15_000_000
loss_prob_ppm = 0
reorder_prob_ppm = 0
bandwidth_bps = 25_000_000
cold_dial_penalty_ns = 200_000_000
cache_warm_after_ns = 200_000_000
cache_invalidate_after_idle_ns = 30_000_000_000

[[relays]]
id = "R"
ingress_capacity_bps = 1_000_000_000
egress_capacity_bps_per_link = 100_000_000
queue_depth_bytes = 65_536
cold_start_penalty_ns = 0

[[peers]]
id = "orch"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 750_000_000, suspicion_timeout_ns = 3_750_000_000, indirect_ping_fanout = 2 }
[[peers]]
id = "stage-0"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 750_000_000, suspicion_timeout_ns = 3_750_000_000, indirect_ping_fanout = 2 }
[[peers]]
id = "stage-2"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 750_000_000, suspicion_timeout_ns = 3_750_000_000, indirect_ping_fanout = 2 }

[[links]]
from = "orch"
to = "stage-0"
via = "R"
[[links]]
from = "stage-0"
to = "orch"
via = "R"
[[links]]
from = "orch"
to = "stage-2"
via = "R"
[[links]]
from = "stage-2"
to = "orch"
via = "R"
[[links]]
from = "stage-0"
to = "stage-2"
via = "R"
[[links]]
from = "stage-2"
to = "stage-0"
via = "R"

# The kill. `PeerKill` halts the orch — no further sends or recvs,
# no finalize record written.
[[mutations]]
at_ns = 5_000_000_000
kind = "peer_kill"
peer = "orch"

[[snapshots]]
at_ns = 1_000_000_000
[[snapshots]]
at_ns = 4_500_000_000
[[snapshots]]
at_ns = 7_000_000_000
[[snapshots]]
at_ns = 9_500_000_000

# Coarse bound — the orch's incarnation should not have time to
# bump under the partition before the kill. Expected Pass.
[[assertions]]
kind = "self_incarnation_bounded"
peer = "orch"
max_value = 2
