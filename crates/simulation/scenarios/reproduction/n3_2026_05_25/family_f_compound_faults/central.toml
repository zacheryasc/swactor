# Family F central case — compound faults under recovery
# (`N3_SIM_TEST_BATTERY_SPEC.md §3 family F`).
#
# Three SWIM peers. Two overlapping faults:
#   - `Partition` cutting stage-2 from stage-0 over [+10 s, +30 s].
#   - `RelayPeerConnDown { from: orch, to: stage-2 }` over
#     [+20 s, +40 s], overlapping the partition's last 10 s and
#     extending 10 s past its heal.
# The scenario tests whether SWIM behaves under the overlap and
# heal sequence the postmortem mentions but did not isolate.

name = "n3_family_f_central_compound_partition_relay_cut"
seed = 6
duration_ns = 50_000_000_000  # 50 s

[default_tick]
period_ns = 50_000_000

[default_link]
latency_ns = 200_000_000
jitter_stddev_ns = 50_000_000
loss_prob_ppm = 0
reorder_prob_ppm = 0
bandwidth_bps = 25_000_000
cold_dial_penalty_ns = 200_000_000
cache_warm_after_ns = 200_000_000
cache_invalidate_after_idle_ns = 30_000_000_000

[[relays]]
id = "R"
ingress_capacity_bps = 1_000_000_000
egress_capacity_bps_per_link = 100_000_000
queue_depth_bytes = 65_536
cold_start_penalty_ns = 0

[[peers]]
id = "orch"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 750_000_000, suspicion_timeout_ns = 3_750_000_000, indirect_ping_fanout = 2 }
[[peers]]
id = "stage-0"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 750_000_000, suspicion_timeout_ns = 3_750_000_000, indirect_ping_fanout = 2 }
[[peers]]
id = "stage-2"
kind = "swim"
initial_state = "alive"
kind_config = { probe_interval_ns = 500_000_000, probe_timeout_ns = 750_000_000, suspicion_timeout_ns = 3_750_000_000, indirect_ping_fanout = 2 }

[[links]]
from = "orch"
to = "stage-0"
via = "R"
[[links]]
from = "stage-0"
to = "orch"
via = "R"
[[links]]
from = "orch"
to = "stage-2"
via = "R"
[[links]]
from = "stage-2"
to = "orch"
via = "R"
[[links]]
from = "stage-0"
to = "stage-2"
via = "R"
[[links]]
from = "stage-2"
to = "stage-0"
via = "R"

# Fault 1: partition at +10 s.
[[mutations]]
at_ns = 10_000_000_000
kind = "partition"
peers_a = ["stage-0"]
peers_b = ["stage-2"]

# Fault 2: relay-peer-conn-down at +20 s (overlap with partition's
# last 10 s, runs 20 s).
[[mutations]]
at_ns = 20_000_000_000
kind = "relay_peer_conn_down"
relay = "R"
from = "orch"
to = "stage-2"
duration_ns = 20_000_000_000

# Heal the partition at +30 s.
[[mutations]]
at_ns = 30_000_000_000
kind = "heal"

[[snapshots]]
at_ns = 5_000_000_000
[[snapshots]]
at_ns = 15_000_000_000
[[snapshots]]
at_ns = 25_000_000_000
[[snapshots]]
at_ns = 35_000_000_000
[[snapshots]]
at_ns = 45_000_000_000

# Family A's load-bearing assertion over the overlap window. Expected
# to Fail on current source — the relay-peer-down's behavior leaks
# through the heal-window.
[[assertions]]
kind = "no_flap_while_probes_ok"
peer = "stage-2"
window_start_ns = 20_000_000_000
window_end_ns = 40_000_000_000
