# Reference scenario (TESTING_SPEC §6.5).
#
# 60-second pipeline-parallel scenario mirroring the N=3 vastai
# corpus layout: orchestrator + 3 chained stages + collector.
# Boots, runs steady-state SWIM for 20 s, partitions stage-2 at
# t=20 s, heals at t=35 s, restarts stage-1 at t=45 s, shuts down
# cleanly at t=60 s.
#
# Schema floor (§6.1–§6.4), schema round-trip (§7), causality
# (§8), and lifecycle (§11) all run against the bundle produced
# from this scenario.

run_id = "ref-001"
seed = 42
duration_ms = 60000

[host_defaults]
mtu = 1500
nat = "FullCone"

# ── Hosts ──────────────────────────────────────────────────────────
[[hosts]]
name = "orchestrator"
role = "orchestrator"
start_at_ms = 0
stop_at_ms = 60000

[[hosts]]
name = "stage-0"
role = "stage"
stage_index = 0
start_at_ms = 100
stop_at_ms = 60000

[[hosts]]
name = "stage-1"
role = "stage"
stage_index = 1
start_at_ms = 100
restart_at_ms = [45000]
stop_at_ms = 60000

[[hosts]]
name = "stage-2"
role = "stage"
stage_index = 2
start_at_ms = 100
stop_at_ms = 60000

[[hosts]]
name = "collector"
role = "collector"
start_at_ms = 0
stop_at_ms = 60000

# ── Links ──────────────────────────────────────────────────────────
[[links]]
a = "orchestrator"
b = "stage-0"
bandwidth_bps = 100_000_000
one_way_delay_ms = 12
jitter_ms = 4
loss = 0.001

[[links]]
a = "stage-0"
b = "stage-1"
bandwidth_bps = 100_000_000
one_way_delay_ms = 12
jitter_ms = 4
loss = 0.001

[[links]]
a = "stage-1"
b = "stage-2"
bandwidth_bps = 100_000_000
one_way_delay_ms = 12
jitter_ms = 4
loss = 0.001

[[links]]
a = "orchestrator"
b = "collector"
bandwidth_bps = 100_000_000
one_way_delay_ms = 5
jitter_ms = 1
loss = 0.0

# ── Mutations ──────────────────────────────────────────────────────
[[mutations]]
kind = "partition"
at_ms = 20000
edges = [["stage-2", "stage-1"]]

[[mutations]]
kind = "heal"
at_ms = 35000
edges = [["stage-2", "stage-1"]]

[[mutations]]
kind = "restart"
at_ms = 45000
node = "stage-1"
