[package]
name = "telemetry"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
swactor = { path = "../..", features = ["serde", "transport"] }
swactor-transport = { path = "../transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iroh = "0.98"
crossbeam-channel = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
