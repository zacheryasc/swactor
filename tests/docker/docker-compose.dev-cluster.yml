services:
  seed:
    image: swactor-dev-cluster
    command:
      - "--identity-dir"
      - "/identity"
      - "--listen"
      - "0.0.0.0:11204"
      - "--no-relay"
      - "--pool-name"
      - "dev-pool"
      - "--pool-capacity"
      - "104857600"
      - "--actors"
      - "2"
    volumes:
      - /home/aaron/swactor-pooled-datastore/.dev-cluster/seed-identity:/identity:ro
    networks:
      dev-cluster:
        ipv4_address: 10.0.2.10
    ports:
      - "9100:9090"

  node-2:
    image: swactor-dev-cluster
    command:
      - "--seed-node-id"
      - "d5469553d4408073022fee3e41c99cf9778bf3621e430f75f8c8ae7d6de0153f"
      - "--seed-addrs"
      - "10.0.2.10:11204"
      - "--listen"
      - "0.0.0.0:11204"
      - "--no-relay"
      - "--pool-name"
      - "dev-pool"
      - "--pool-capacity"
      - "104857600"
      - "--actors"
      - "2"
    networks:
      dev-cluster:
        ipv4_address: 10.0.2.11
    ports:
      - "9101:9090"
    depends_on:
      - seed

  node-3:
    image: swactor-dev-cluster
    command:
      - "--seed-node-id"
      - "d5469553d4408073022fee3e41c99cf9778bf3621e430f75f8c8ae7d6de0153f"
      - "--seed-addrs"
      - "10.0.2.10:11204"
      - "--listen"
      - "0.0.0.0:11204"
      - "--no-relay"
      - "--pool-name"
      - "dev-pool"
      - "--pool-capacity"
      - "104857600"
      - "--actors"
      - "2"
    networks:
      dev-cluster:
        ipv4_address: 10.0.2.12
    ports:
      - "9102:9090"
    depends_on:
      - seed

networks:
  dev-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.2.0/24
