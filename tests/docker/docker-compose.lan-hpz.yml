## LAN cluster — hpz side (192.168.1.106)
## Run alongside docker-compose.lan-thinkpad.yml on the thinkpad.
##
##   docker compose -f tests/docker/docker-compose.lan-hpz.yml up -d --build
services:
  seed:
    build:
      context: ../..
      dockerfile: Dockerfile
    network_mode: host
    command:
      - "--listen"
      - "192.168.1.106:7000"
      - "--dashboard-port"
      - "9091"
      - "--actors"
      - "2"

  node-2:
    build:
      context: ../..
      dockerfile: Dockerfile
    network_mode: host
    command:
      - "--listen"
      - "192.168.1.106:7001"
      - "--seed"
      - "192.168.1.106:7000"
      - "--dashboard-port"
      - "9092"
      - "--actors"
      - "2"
    depends_on:
      - seed
