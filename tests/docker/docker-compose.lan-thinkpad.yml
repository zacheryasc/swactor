## LAN cluster — thinkpad side (192.168.1.102)
## Seed is on hpz at 192.168.1.106:7000.
##
##   docker compose -f tests/docker/docker-compose.lan-thinkpad.yml up -d --build
services:
  node-3:
    build:
      context: ../..
      dockerfile: Dockerfile
    network_mode: host
    command:
      - "--listen"
      - "192.168.1.102:7000"
      - "--seed"
      - "192.168.1.106:7000"
      - "--dashboard-port"
      - "9093"
      - "--actors"
      - "2"

  node-4:
    build:
      context: ../..
      dockerfile: Dockerfile
    network_mode: host
    command:
      - "--listen"
      - "192.168.1.102:7001"
      - "--seed"
      - "192.168.1.106:7000"
      - "--dashboard-port"
      - "9094"
      - "--actors"
      - "2"

  node-5:
    build:
      context: ../..
      dockerfile: Dockerfile
    network_mode: host
    command:
      - "--listen"
      - "192.168.1.102:7002"
      - "--seed"
      - "192.168.1.106:7000"
      - "--dashboard-port"
      - "9095"
      - "--actors"
      - "2"
