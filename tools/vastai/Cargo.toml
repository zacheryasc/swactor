[package]
name = "swactor-vastai"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false


[features]
default = []
test-support = []
[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
urlencoding = "2"

[dev-dependencies]
wiremock = "0.6"

[lints]
workspace = true
